[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crude-research"
version = "0.1.1"
description = "MCX CRUDEOIL / CRUDEOILM market-data and Black-76 research foundation (Zerodha Kite Connect)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "crude-research" }]
keywords = ["mcx", "crudeoil", "options", "black76", "zerodha", "kite"]
dependencies = [
    "kiteconnect>=5.0.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-python-dateutil>=2.9",
    "scipy-stubs>=1.14",
]

[project.scripts]
crude-research = "crude_research.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crude_research = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not network'"
markers = [
    "network: hits live Zerodha APIs (disabled by default)",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["crude_research"]
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kiteconnect", "kiteconnect.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
